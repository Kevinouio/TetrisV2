# @package _global_
defaults:
  - override /trainer: battle_dqn

preset:
  name: battle_smoke
  trainer: battle_dqn

trainer:
  args:
    total_timesteps: 20
    buffer_size: 256
    warmup_steps: 10
    batch_size: 8
    learning_rate_decay_steps: 20
    epsilon_decay_steps: 20
    max_match_steps: 20
    random_opponent_weight: 1.0
    heuristic_opponent_weight: 0.0
    frozen_opponent_weight: 0.0
    current_opponent_weight: 0.0
    disable_curriculum: true
    log_frequency: 10
    eval_frequency: 1000
    checkpoint_frequency: 1000
    pool_checkpoint_frequency: 1000
    log_dir: ${paths.runs_dir}/battle_smoke
